name: Test & Package

on:
  push:
  pull_request:

concurrency:
  group: test-package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: anime_flow
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Set up Redis test executable
        run: |
          if ! command -v redis-server >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y redis-server
          fi
          redis_executable="$(command -v redis-server)"
          test -x "$redis_executable"
          echo "REDIS_TEST_EXECUTABLE=$redis_executable" >> "$GITHUB_ENV"

      - name: Run tests
        env:
          COLLECTION_TEST_MYSQL_URL: jdbc:mysql://127.0.0.1:3306/anime_flow?useUnicode=true&characterEncoding=utf-8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
          COLLECTION_TEST_MYSQL_USER: root
          COLLECTION_TEST_MYSQL_PASSWORD: root
        run: mvn -B test

      - name: Package project
        run: mvn -B package -DskipTests
